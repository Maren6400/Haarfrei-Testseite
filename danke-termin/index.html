    .ig-thanks p {

    .ig-thanks-sub { font-size: 0.86rem; color: var(--text-faint); max-width: 420px; margin: 0 auto 2rem; }

    .ig-footer {
      text-align: center; padding: 1rem 0 2rem; font-size: 0.72rem; color: var(--text-faint);
    }
    .ig-footer a { color: var(--text-faint); text-decoration: underline; }
    .ig-footer .sep { margin: 0 0.4rem; }

      .ig-thanks h1 { font-size: 2.3rem; }
